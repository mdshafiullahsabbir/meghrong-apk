name: Build Meghrong Grocery APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Meghrong_Grocery_Android_Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          

      - name: Unzip Android project
        run: unzip -o Meghrong_Grocery_Android_Source.zip -d android-source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:packages: 'platform-tools, platforms;android-35, build-tools;35.0.0, extras;google;google_tv'
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meghrong-Grocery-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
